<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hand Turkey</title>
  <!-- Link previews (iMessage, X, Facebook, Slack…). og:image must be an absolute URL. -->
  <meta name="description" content="Turn your hand into a Thanksgiving turkey with AR, then record a clip to send.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.highdimensionalcoconuts.com/Work/Sandbox/TurkeyHand/">
  <meta property="og:title" content="Hand Turkey 🦃">
  <meta property="og:description" content="Turn your hand into a Thanksgiving turkey with AR, then record a clip to send.">
  <meta property="og:image" content="https://www.highdimensionalcoconuts.com/Work/Sandbox/TurkeyHand/assets/share-card.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="420">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="../../../Assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #16130f; overflow: hidden;
      font: 15px/1.45 -apple-system, system-ui, sans-serif; color: #f6ecd9;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* The camera is drawn into the WebGL canvas (so it gets recorded). The
       <video> sits full-size underneath the opaque canvas rather than hidden:
       Chrome pauses muted video it considers invisible. */
    #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    #view { position: relative; }
    button, .button { font: inherit; cursor: pointer; color: #f6ecd9; text-decoration: none;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px; padding: 10px 20px; }
    button:disabled { opacity: 0.5; cursor: default; }

    #start { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center;
      justify-content: center; padding: 16px; background: #16130f; }
    #start[hidden] { display: none; }
    #start .card { max-width: 340px; text-align: center; }
    #start h1 { font: 44px/1.1 Chewy, cursive; margin: 0 0 12px; color: #ffe9c2; }
    #start p { color: #d8c4a0; margin: 0 0 22px; }
    #startBtn { background: #c4681e; border-color: #e38a3c; font-weight: 600; padding: 12px 28px; }
    #loadSteps { list-style: none; padding: 0; margin: 18px 0 0; display: flex; gap: 16px; justify-content: center;
      font-size: 13px; color: #b9a888; }
    #loadSteps li::before { display: inline-block; width: 1.1em; margin-right: 4px; }
    #loadSteps li.loading::before { content: ""; width: 9px; height: 9px; margin-right: 7px; vertical-align: -1px;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    #loadSteps li.done { color: #e9d9b8; }
    #loadSteps li.done::before { content: "✓"; color: #9fd08a; }
    #loadSteps li.error::before { content: "✕"; color: #ff9a8a; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status { position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
      bottom: calc(env(safe-area-inset-bottom) + 108px); padding: 6px 14px; border-radius: 999px;
      background: rgba(22,19,15,0.7); font-size: 14px; white-space: nowrap; }
    #status:empty { display: none; }

    #recordBtn { position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
      bottom: calc(env(safe-area-inset-bottom) + 24px); width: 72px; height: 72px; padding: 0;
      border-radius: 50%; border: none; touch-action: none;
      background: conic-gradient(#e0402f calc(var(--progress, 0) * 360deg), rgba(255,255,255,0.9) 0); }
    #recordBtn::after { content: ""; position: absolute; inset: 6px; border-radius: 50%;
      background: rgba(22,19,15,0.55); transition: all 0.15s; }
    #recordBtn.recording::after { inset: 18px; border-radius: 8px; background: #e0402f; }

    #sheet { position: fixed; inset: 0; z-index: 20; background: rgba(12,10,8,0.94); overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px;
      padding: calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    #sheet[hidden] { display: none; }
    /* Everything tappable lives in .sheet-body; a tap anywhere else closes the sheet. */
    #sheet .sheet-body { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; }
    #sheet video { max-width: 100%; max-height: 50vh; border-radius: 12px; background: #000; }
    #sheet .close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px;
      width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
      background: rgba(255,255,255,0.12); border: none; }
    #sheet h2 { font: 30px/1.1 Chewy, cursive; color: #ffe9c2; margin: 4px 0 0; font-weight: normal; }
    #sheet .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 8px; max-width: 440px; }
    #sheet .social a, #sheet .social button { display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 60px; padding: 0; border: none; background: none; color: #ffe9c2; font-size: 12px; text-decoration: none; }
    #sheet .social [hidden] { display: none; }
    #sheet .ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255,255,255,0.1); transition: background 0.15s; }
    #sheet .social a:hover .ico, #sheet .social button:hover .ico { background: rgba(255,255,255,0.2); }
    #sheet [data-share] .ico { background: #c4681e; }
    /* Brand icons are single-colour SVGs used as masks, so they take the text colour. */
    #sheet .ico i { width: 22px; height: 22px; background: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
    #sheet .hint { margin: 0; min-height: 1.4em; color: #d8c4a0; font-size: 13px; text-align: center; }

    /* --- ?debug only --- */
    #panel, #debuglog { display: none; }
    body.debug #panel, body.debug #debuglog { display: block; }
    #panel { position: fixed; top: 12px; right: 12px; z-index: 15; width: 230px; max-height: calc(100vh - 24px);
      overflow-y: auto; background: rgba(22,19,15,0.85); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    #panel h2 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #c9b48f; }
    #panel label { display: grid; grid-template-columns: 1fr 44px; gap: 0 6px; margin: 3px 0; }
    #panel label input[type=range] { grid-column: 1 / 3; width: 100%; margin: 0; }
    #panel label.check { display: flex; gap: 6px; }
    #panel output { text-align: right; color: #c9b48f; }
    #panel button { font-size: 12px; padding: 4px 10px; margin-top: 8px; border-radius: 5px; }
    #debuglog { position: fixed; left: 12px; bottom: 12px; z-index: 15; width: min(520px, 60vw);
      max-height: 30vh; overflow-y: auto; margin: 0; padding: 6px 8px;
      background: rgba(0,0,0,0.75); border-radius: 6px; font: 11px/1.4 ui-monospace, Menlo, monospace;
      color: #bfe6bf; white-space: pre-wrap; word-break: break-word; pointer-events: auto; }
    #debuglog .err { color: #ff9a8a; }
    #debuglog .warn { color: #ffd479; }
  </style>
  <script>
    // Classic script so errors are captured even if the module fails to load.
    // The log is only shown with ?debug, but always mirrors to the console.
    (function () {
      const buffer = [];
      function write(msg, cls) {
        const line = "[" + new Date().toISOString().substr(11, 12) + "] " + msg;
        (cls === "err" ? console.error : cls === "warn" ? console.warn : console.log)(line);
        const el = document.getElementById("debuglog");
        if (!el) { buffer.push([line, cls]); return; }
        for (const [m, c] of buffer.splice(0)) append(el, m, c);
        append(el, line, cls);
      }
      function append(el, line, cls) {
        const div = document.createElement("div");
        if (cls) div.className = cls;
        div.textContent = line;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
      }
      window.__log = write;
      window.addEventListener("error", (e) => write("error: " + (e.message || e.error) +
        (e.filename ? " @ " + e.filename + ":" + e.lineno : ""), "err"));
      window.addEventListener("unhandledrejection", (e) =>
        write("unhandled rejection: " + (e.reason && (e.reason.message || e.reason)), "err"));
      if (!window.isSecureContext) {
        write("Not a secure context: the camera will be blocked. Use https, or " +
          "http://localhost:<port> / 127.0.0.1 (not 0.0.0.0 or a LAN IP).", "warn");
      }
    })();
  </script>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
  } }
  </script>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="view"></canvas>
  </div>

  <div id="start">
    <div class="card">
      <h1>Hand Turkey</h1>
      <p>Use AR to turn your hand into a turkey.</p>
      <button id="startBtn">Start the camera</button>
      <ul id="loadSteps">
        <li data-step="hands" class="loading">Turkey model</li>
        <li data-step="tracker" class="loading">Hand tracking</li>
      </ul>
    </div>
  </div>

  <div id="status"></div>
  <button id="recordBtn" aria-label="Record: hold, or tap to start and stop"></button>

  <div id="sheet" hidden>
    <button class="close" data-close aria-label="Close preview">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-body">
      <video playsinline loop controls></video>
      <h2>Share the filter</h2>
      <div class="social">
        <a data-social="instagram" target="_blank" rel="noopener"><span class="ico"><i style="--icon: url(assets/icons/instagram.svg)"></i></span><span>Instagram</span></a>
        <a data-social="tiktok" target="_blank" rel="noopener"><span class="ico"><i style="--icon: url(assets/icons/tiktok.svg)"></i></span><span>TikTok</span></a>
        <a data-social="x" target="_blank" rel="noopener"><span class="ico"><i style="--icon: url(assets/icons/x.svg)"></i></span><span>X</span></a>
        <a data-social="facebook" target="_blank" rel="noopener"><span class="ico"><i style="--icon: url(assets/icons/facebook.svg)"></i></span><span>Facebook</span></a>
        <a data-social="bluesky" target="_blank" rel="noopener"><span class="ico"><i style="--icon: url(assets/icons/bluesky.svg)"></i></span><span>Bluesky</span></a>
      </div>
      <div class="social">
        <button data-share hidden><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M8 10H6v10h12V10h-2"/></svg></span><span>Share…</span></button>
        <a data-save><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span><span>Download</span></a>
        <button data-copy><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span>Copy link</span></button>
      </div>
      <p class="hint" data-hint></p>
    </div>
  </div>

  <div id="panel"></div>
  <pre id="debuglog"></pre>

  <script type="module" src="turkey.js"></script>
</body>
</html>
