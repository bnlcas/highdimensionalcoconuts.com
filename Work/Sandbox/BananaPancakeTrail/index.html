<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banana Pancake Trail</title>
<meta name="description" content="Banana Pancake Trail: an Aussie backpacker roguelike. Start on Khao San Road, drink, party, get your photo in front of obscure landmarks, and try not to end up in a Thai prison. Mature audiences.">
<meta property="og:type" content="website">
<meta property="og:title" content="Banana Pancake Trail">
<meta property="og:description" content="An Aussie backpacker roguelike through South East Asia. Buckets, bedbugs, bus rides of death, and Mum's patience. 18+.">
<meta property="og:url" content="https://www.highdimensionalcoconuts.com/Work/Sandbox/BananaPancakeTrail/">
<link rel="icon" type="image/x-icon" href="../../../Assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3e2bf; --bg2: #ebd19c; --paper: #fffaf0; --paper2: #fbf0da; --ink: #2b2118; --dim: #7a6a55; --edge: #d9c193;
    --accent: #1f7a4d; --accent2: #16603b; --hot: #ff6a3d; --pink: #e83f7d; --gold: #f4b400; --sea: #8fd3cc; --sea2: #6cc0b8;
    --good: #1f8a4c; --bad: #c8362c; --warn: #d78a00; --shadow: rgba(60, 40, 10, 0.18);
    --btn: #fff; --btnEdge: #c9b083; --chip: #f1e3c4;
    --land: #f7e7bd; --landEdge: #6b5233;
  }
  body.night {
    --bg: #160d2e; --bg2: #24123f; --paper: #241a45; --paper2: #2e2156; --ink: #f2eaff; --dim: #a597c9; --edge: #4a3a7a;
    --accent: #ff4fd8; --accent2: #c42fa8; --hot: #3ff0ff; --gold: #ffd84f; --sea: #1f2f5c; --sea2: #1a2750;
    --shadow: rgba(0, 0, 0, 0.45); --btn: #31245f; --btnEdge: #18103a; --chip: #3a2b6c; --land: #3d2e66; --landEdge: #a98cff;
  }
  body.prison {
    --bg: #3a2a1c; --bg2: #2a1e14; --paper: #f4e8d4; --paper2: #ead9bc; --ink: #2b1d12; --dim: #6b5a45; --edge: #b89a6e;
    --accent: #e86a10; --accent2: #b4500a; --hot: #e86a10; --chip: #e5d2b0; --btn: #fff7ea; --btnEdge: #b89a6e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(1200px 700px at 70% -10%, var(--bg2), var(--bg)) fixed; color: var(--ink); font: 14px/1.45 'Nunito', system-ui, sans-serif; transition: background 0.6s; -webkit-tap-highlight-color: transparent; }
  body.night { background: radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 70% 15%, #fff6 50%, transparent 51%), radial-gradient(1.5px 1.5px at 85% 60%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 40% 80%, #fff4 50%, transparent 51%), radial-gradient(1200px 700px at 70% -10%, var(--bg2), var(--bg)) fixed; background-size: 300px 300px, 410px 410px, 520px 520px, 370px 370px, auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  b, strong { font-weight: 800; }
  .hidden { display: none !important; }
  .dim { color: var(--dim); }
  .warn { color: var(--warn); font-weight: 700; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  h1, h2, h3 { font-family: 'Lilita One', sans-serif; font-weight: 400; letter-spacing: 0.3px; margin: 0; }

  /* ---------- top bar ---------- */
  #top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--paper); border-bottom: 3px solid var(--accent); box-shadow: 0 2px 10px var(--shadow); flex-wrap: wrap; }
  #logo { font: 20px/1 'Lilita One'; color: var(--accent); cursor: pointer; white-space: nowrap; }
  #logo span { color: var(--hot); }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; }
  .st { display: flex; align-items: center; gap: 5px; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .st small { font-weight: 600; color: var(--dim); }
  .hpbar { width: 90px; height: 10px; border-radius: 6px; background: #0002; position: relative; overflow: hidden; }
  .hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #e33, #f85); border-radius: 6px; }
  .hpbar u { position: absolute; inset: 0 0 0 auto; background: repeating-linear-gradient(45deg, #5a2a1a, #5a2a1a 3px, #7a3a22 3px, #7a3a22 6px); text-decoration: none; }
  .pips { display: inline-flex; gap: 2px; }
  .pips i { width: 9px; height: 9px; border-radius: 50%; background: #0002; }
  .pips i.on { background: var(--bad); }
  .st.alert { animation: throb 1s infinite; background: #ffd9d4; color: #8a1a10; }
  @keyframes throb { 50% { transform: scale(1.06); } }
  .tb { background: var(--btn); border: 2px solid var(--btnEdge); border-radius: 10px; padding: 4px 10px; font-weight: 800; }
  .tb:disabled { opacity: 0.45; cursor: not-allowed; }
  .status { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px 0; }
  .tag { font-size: 12px; font-weight: 700; background: var(--chip); border-radius: 6px; padding: 2px 8px; }
  .tag.bad { background: #ffd9d4; color: #8a1a10; } .tag.warn { background: #ffecc2; color: #7a4d00; } .tag.good { background: #d5f2df; color: #145a32; }

  /* ---------- layout ---------- */
  #app { display: grid; grid-template-columns: minmax(300px, 0.95fr) minmax(360px, 1.25fr) 310px; gap: 12px; padding: 12px; align-items: start; max-width: 1600px; margin: 0 auto; }
  .card { background: var(--paper); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 0 4px 14px var(--shadow); }
  .card > header { padding: 10px 14px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card > header h2 { font-size: 22px; }
  .pad { padding: 4px 14px 14px; }
  #mapcard { position: sticky; top: 64px; overflow: hidden; }
  #mapwrap { position: relative; aspect-ratio: 804 / 864; max-height: calc(100vh - 200px); width: 100%; }
  .map-svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
  .mapbtns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .mapbtns button { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--btnEdge); background: var(--btn); font-weight: 800; }
  #loc { padding: 8px 14px 12px; border-top: 2px dashed var(--edge); font-size: 13px; }
  #pop { position: absolute; z-index: 5; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 8px; box-shadow: 0 6px 18px var(--shadow); min-width: 220px; max-width: 290px; font-size: 13px; }
  #pop h4 { margin: 0 0 4px; font: 16px 'Lilita One'; }

  /* map styles */
  .sea { fill: var(--sea); }
  .wave { fill: none; stroke: #fff6; stroke-width: 1.5; }
  body.night .wave { stroke: #ffffff14; }
  .ring { fill: none; stroke: #8a5a2033; stroke-width: 9; }
  .ring2 { fill: none; stroke: #8a5a2022; stroke-width: 3; }
  body.night .ring, body.night .ring2 { stroke: #ff4fd812; }
  .land { fill: var(--land); stroke: var(--landEdge); stroke-width: 1.6; stroke-linejoin: round; }
  .lake { fill: var(--sea); stroke: var(--landEdge); stroke-width: 1; }
  .river { fill: none; stroke: var(--sea2); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  body.night .river { stroke: #5a7ad8; }
  .lbl-land { font: 15px 'Lilita One'; fill: #6b523399; text-anchor: middle; letter-spacing: 2px; pointer-events: none; }
  body.night .lbl-land { fill: #a98cff66; }
  .lbl-grey { font: 13px 'Permanent Marker'; fill: #6b523366; text-anchor: middle; pointer-events: none; }
  .lbl-sea { font: italic 13px 'Nunito'; fill: #1f5f5a88; text-anchor: middle; pointer-events: none; letter-spacing: 1px; }
  body.night .lbl-sea, body.night .lbl-grey { fill: #ffffff33; }
  .lbl-joke { font: 14px 'Permanent Marker'; fill: #b33; text-anchor: middle; pointer-events: none; }
  .lbl-note { font: 12px 'Permanent Marker'; fill: #6b5233aa; pointer-events: none; }
  body.night .lbl-note { fill: #ffffff55; }
  .compass circle { fill: #fffaf0aa; stroke: var(--landEdge); }
  .compass path { fill: #b33; }
  .compass text { font: 12px 'Lilita One'; text-anchor: middle; fill: var(--landEdge); }
  .compass text.sm { font: 10px 'Permanent Marker'; }
  .net line { stroke: #6b523322; stroke-width: 1.2; stroke-dasharray: 2 4; }
  body.night .net line { stroke: #ffffff18; }
  .trail polyline { fill: none; stroke: #d33; stroke-width: 2.5; stroke-dasharray: 6 4; opacity: 0.55; stroke-linejoin: round; }
  .reach line, .reach path { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
  .reach .fly { stroke-dasharray: 3 6; stroke: #2f6fd1; }
  .reach .night { stroke: #7a4fd0; }
  .reach .blocked { stroke: #999; opacity: 0.5; }
  body.night .reach .fly { stroke: var(--hot); }
  body.night .reach .night { stroke: var(--gold); }
  .node { cursor: pointer; }
  .node .hit { fill: transparent; }
  .node circle:not(.hit), .node path { stroke-width: 2.2; }
  .node text { font: 12.5px 'Permanent Marker'; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; pointer-events: none; }
  body.night .node text { stroke: #2a1e50; }
  .node:not(.vis):not(.reach):not(.here) text { opacity: 0.7; }
  .node.reach text { font-size: 14px; }
  .node.reach circle:not(.hit), .node.reach path { stroke-width: 3.4; }
  .node.here text { font-size: 15px; fill: #b33; }
  .node.banned text { text-decoration: line-through; opacity: 0.4; }
  .node:hover text { fill: var(--accent); }
  .pulse { fill: none; stroke: #d33; stroke-width: 2.5; animation: pulse 1.6s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
  .pin { font-size: 18px; text-anchor: middle; pointer-events: none; }

  /* ---------- scene ---------- */
  #scene .phase { font: 13px 'Lilita One'; letter-spacing: 1px; padding: 3px 10px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .blurb { margin: 0 0 6px; color: var(--dim); }
  .sec { margin-top: 14px; }
  .sec > h3 { font-size: 16px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; color: var(--accent2); }
  body.night .sec > h3 { color: var(--accent); }
  .sec > h3 small { font: 600 12px 'Nunito'; color: var(--dim); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .opt { text-align: left; background: var(--btn); border: 2px solid var(--btnEdge); border-bottom-width: 4px; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; transition: transform 0.08s; position: relative; }
  .opt:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: translateY(1px); border-bottom-width: 2px; }
  .opt:disabled { opacity: 0.5; cursor: not-allowed; }
  .opt .t { font-weight: 800; line-height: 1.25; }
  .opt .s { font-size: 12px; color: var(--dim); }
  .opt .r { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 700; margin-top: 2px; }
  .opt .r span { background: var(--chip); border-radius: 5px; padding: 0 6px; }
  .opt.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .opt.flash { animation: flash 1s 2; }
  @keyframes flash { 50% { border-color: var(--hot); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hot) 40%, transparent); } }
  .opt .badge { position: absolute; top: -8px; right: 8px; font: 11px 'Lilita One'; background: var(--hot); color: #fff; padding: 1px 7px; border-radius: 999px; }
  .stars { color: var(--gold); letter-spacing: -1px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .go { display: block; width: 100%; margin-top: 14px; font: 22px 'Lilita One'; letter-spacing: 0.5px; padding: 12px; border-radius: 14px; border: 0; border-bottom: 5px solid var(--accent2); background: var(--accent); color: #fff; }
  body.night .go { color: #1a0f30; }
  .go:active { transform: translateY(2px); border-bottom-width: 3px; }
  .recap { background: var(--paper2); border: 2px dashed var(--edge); border-radius: 12px; padding: 8px 12px; margin: 0 0 10px; font-size: 13px; }
  .recap p { margin: 4px 0 0; padding-left: 8px; border-left: 3px solid var(--edge); }
  .recap p.bad { border-color: var(--bad); } .recap p.good { border-color: var(--good); } .recap p.warn { border-color: var(--warn); font-weight: 800; } .recap p.beer { border-color: var(--gold); } .recap p.photo { border-color: #2f6fd1; } .recap p.ach { border-color: var(--gold); font-weight: 800; } .recap p.big { border-color: var(--accent); font-weight: 700; }
  .note { background: var(--paper2); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
  .stakes { display: inline-flex; gap: 4px; margin-top: 4px; }
  .stakes button { border: 2px solid var(--btnEdge); background: var(--paper2); border-radius: 8px; padding: 1px 8px; font-weight: 800; font-size: 12px; }

  /* ---------- side ---------- */
  #side { position: sticky; top: 64px; max-height: calc(100vh - 76px); display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; flex-wrap: wrap; }
  .tabs button { flex: 1; min-width: 44px; border: 0; background: transparent; border-radius: 8px 8px 0 0; padding: 6px 4px; font-weight: 800; font-size: 12px; color: var(--dim); }
  .tabs button.on { background: var(--paper2); color: var(--ink); }
  #tabbody { background: var(--paper2); margin: 0 8px 8px; border-radius: 0 0 10px 10px; padding: 8px; overflow-y: auto; flex: 1; min-height: 200px; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .slot { background: var(--paper); border: 2px dashed var(--edge); border-radius: 10px; padding: 6px; min-height: 66px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .slot.full { border-style: solid; }
  .slot .ic { font-size: 22px; line-height: 1; }
  .slot .nm { font-weight: 800; line-height: 1.15; }
  .slot .bt { display: flex; gap: 4px; margin-top: auto; }
  .slot .bt button { border: 1px solid var(--btnEdge); background: var(--btn); border-radius: 6px; font-size: 11px; font-weight: 800; padding: 1px 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--edge); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .g { flex: 1; min-width: 0; }
  .row .ic { font-size: 20px; }
  .mini { border: 1px solid var(--btnEdge); background: var(--btn); border-radius: 6px; font-size: 11px; font-weight: 800; padding: 2px 7px; white-space: nowrap; }
  .mini:disabled { opacity: 0.45; }
  .spark { width: 70px; height: 22px; }
  .log p { margin: 0 0 6px; font-size: 12.5px; padding-left: 8px; border-left: 3px solid var(--edge); }
  .log p .d { color: var(--dim); font-weight: 800; margin-right: 4px; }
  .log p.big { border-color: var(--accent); font-weight: 700; }
  .log p.ach { border-color: var(--gold); font-weight: 800; }
  .log p.bad { border-color: var(--bad); } .log p.good { border-color: var(--good); } .log p.warn { border-color: var(--warn); font-weight: 800; }
  .log p.photo { border-color: #2f6fd1; } .log p.beer { border-color: var(--gold); }

  /* ---------- modal card ---------- */
  #modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(20, 10, 0, 0.45); padding: 14px; backdrop-filter: blur(2px); }
  .ev { width: min(560px, 100%); max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 16px; border: 3px solid var(--ink); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); padding: 18px 20px 16px; animation: pop 0.22s ease-out; }
  @keyframes pop { from { transform: scale(0.9) rotate(-1deg); opacity: 0; } }
  .ev .icon { font-size: 44px; line-height: 1; float: right; margin: -4px 0 4px 10px; }
  .ev h2 { font-size: 26px; margin-bottom: 6px; color: var(--accent2); }
  body.night .ev h2 { color: var(--accent); }
  .ev p { margin: 0 0 8px; }
  .ev .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; clear: both; }
  .ev .choices .opt { width: 100%; }
  .ev .result { margin-top: 12px; padding: 10px 12px; background: var(--paper2); border-radius: 10px; border-left: 4px solid var(--accent); clear: both; }
  .ev .result i { color: var(--dim); display: block; margin-top: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--chip); }
  .chip.neg { background: #ffd9d4; color: #8a1a10; } .chip.pos { background: #d5f2df; color: #145a32; } .chip.gold { background: #fff0b8; color: #6a4a00; } .chip.pink { background: #ffd6ea; color: #8a1648; }

  /* ---------- title & end ---------- */
  #title, #end { position: fixed; inset: 0; z-index: 60; overflow-y: auto; background: radial-gradient(900px 600px at 50% 0%, #ffd27a, #f08a3c 55%, #b8451f); padding: 20px 14px 40px; }
  #end { background: rgba(20, 10, 0, 0.6); backdrop-filter: blur(3px); }
  .tw { max-width: 980px; margin: 0 auto; }
  .logo-big { text-align: center; color: #fff; font: clamp(40px, 9vw, 84px)/0.95 'Lilita One'; text-shadow: 0 4px 0 #8a2d10, 0 8px 22px rgba(0, 0, 0, 0.3); margin-top: 10px; }
  .logo-big small { display: block; font: 800 clamp(14px, 2.6vw, 20px) 'Nunito'; letter-spacing: 1px; text-shadow: 0 2px 0 #8a2d10; margin-top: 10px; }
  .r18 { display: block; width: fit-content; margin: 14px auto 0; background: #2b2118; color: #ffd27a; padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 13px; text-align: center; }
  .tpanel { background: #fffaf0; color: #2b2118; border-radius: 18px; padding: 16px; margin-top: 18px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); }
  .tpanel h3 { font-size: 20px; margin-bottom: 8px; color: #1f7a4d; }
  .namebox { display: flex; gap: 8px; }
  .namebox input { flex: 1; font: 800 18px 'Nunito'; padding: 8px 12px; border-radius: 10px; border: 2px solid #d9c193; background: #fff; color: #2b2118; min-width: 0; }
  .archs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
  .arch { text-align: left; background: #fff; border: 3px solid #e7d3a8; border-radius: 14px; padding: 10px 12px; color: #2b2118; }
  .arch.sel { border-color: #1f7a4d; background: #f1fbf4; }
  .arch .ic { font-size: 30px; }
  .arch b { display: block; font: 17px 'Lilita One'; font-weight: 400; margin: 2px 0; }
  .arch p { margin: 4px 0; font-size: 12.5px; color: #6b5a45; }
  .arch .kv { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; font-weight: 800; }
  .arch .kv span { background: #f1e3c4; border-radius: 5px; padding: 0 6px; }
  .start { display: block; margin: 14px auto 0; font: 26px 'Lilita One'; padding: 12px 30px; border-radius: 16px; border: 0; border-bottom: 6px solid #0e4a2c; background: #1f7a4d; color: #fff; }
  .start.alt { background: #2f6fd1; border-bottom-color: #1a4590; font-size: 18px; padding: 8px 20px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rules { font-size: 13.5px; }
  .rules li { margin-bottom: 4px; }
  .hof { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hof td, .hof th { padding: 4px 6px; border-bottom: 1px dashed #e0cfa6; text-align: left; }
  .hof th { font-size: 11px; text-transform: uppercase; color: #7a6a55; }
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .achv { display: flex; gap: 6px; align-items: flex-start; padding: 6px; border-radius: 10px; background: #f6ecd6; font-size: 12px; }
  .achv.locked { opacity: 0.45; filter: grayscale(1); }
  .achv .ic { font-size: 20px; }
  .achv b { display: block; font-size: 12.5px; line-height: 1.15; }
  .endcard { max-width: 620px; margin: 4vh auto; background: var(--paper); color: var(--ink); border-radius: 18px; border: 3px solid var(--ink); padding: 20px; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5); animation: pop 0.3s; }
  .endcard .big { font-size: 60px; text-align: center; line-height: 1; }
  .endcard h2 { text-align: center; font-size: 34px; color: var(--accent2); }
  .endcard .tot { text-align: center; font: 46px 'Lilita One'; color: var(--hot); margin: 8px 0; }
  .brk { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .brk td { padding: 5px 4px; border-bottom: 1px dashed var(--edge); }
  .brk td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .brk tr.mult td { color: var(--accent2); font-weight: 800; }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 70; background: #2b2118; color: #ffd27a; padding: 10px 18px; border-radius: 999px; font-weight: 800; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); animation: pop 0.25s; pointer-events: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 1250px) {
    #app { grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.2fr); }
    #side { grid-column: 1 / -1; position: static; max-height: none; }
    #tabbody { max-height: 420px; }
  }
  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; padding: 8px 16px; }
    #mapcard { position: static; }
    #mapwrap { max-height: 46vh; margin: 0 auto; }
    #mapcard.collapsed #mapwrap { display: none; }
    .cols2 { grid-template-columns: 1fr; }
    #top { position: static; padding: 6px 10px; gap: 5px; }
    #top .stats { gap: 4px; order: 3; flex-basis: 100%; }
    .st { padding: 2px 8px; font-size: 13px; }
    .st small { display: none; }
    .hpbar { width: 50px; }
    #logo { font-size: 18px; flex: 1; }
    #side, #mapcard { top: 0; }
    .opts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="top" class="hidden"></div>
  <div id="statusline" class="status hidden"></div>
  <main id="app" class="hidden">
    <section id="mapcard" class="card">
      <header><h2 id="maptitle">The Trail</h2><button class="tb" id="maptoggle" title="Show or hide the map">🗺️</button></header>
      <div id="mapwrap"><div class="mapbtns"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit map">⤢</button><button data-z="me" aria-label="Centre on me">🎒</button></div><div id="pop" class="hidden"></div></div>
      <div id="loc"></div>
    </section>
    <section id="scene" class="card"></section>
    <aside id="side" class="card">
      <div class="tabs" id="tabs"></div>
      <div id="tabbody"></div>
    </aside>
  </main>
  <div id="modal" class="hidden"></div>
  <div id="title"></div>
  <div id="end" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
