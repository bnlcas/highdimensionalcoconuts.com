<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Designer</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
  #info {
    position: absolute; bottom: 10px; left: 10px;
    color: #fff; font: 12px/1.4 monospace;
    background: rgba(0,0,0,0.5); padding: 6px 10px;
    border-radius: 4px; pointer-events: none;
  }
  .dg.ac { z-index: 100 !important; }
  #hierarchy {
    position: absolute; top: 10px; left: 10px;
    width: 230px; max-height: 72vh; overflow-y: auto;
    background: rgba(18,18,22,0.88); color: #ccc;
    font: 12px/1.5 -apple-system, system-ui, sans-serif;
    border-radius: 6px; padding: 4px 0 6px;
    user-select: none; z-index: 50;
  }
  .hier-title {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 10px 6px; font-weight: 600; color: #eee;
    border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 3px;
    cursor: pointer;
  }
  .hier-min { color: #888; }
  .hier-title:hover .hier-min { color: #fff; }
  .hier-btn {
    width: 15px; height: 15px; margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #666; border-radius: 50%;
    color: #aaa; font-size: 12px; line-height: 1;
    cursor: pointer; flex: none;
  }
  .hier-btn:hover { background: rgba(120,150,255,0.4); border-color: #9ab; color: #fff; }
  .hier-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px; cursor: pointer; white-space: nowrap;
  }
  .hier-row:hover { background: rgba(255,255,255,0.07); }
  .hier-row.selected { background: rgba(70,120,255,0.35); color: #fff; }
  .hier-caret { width: 12px; display: inline-block; text-align: center; color: #888; }
  .hier-icon { width: 14px; text-align: center; }
  .hier-slot { margin-left: auto; color: #666; font-size: 10px; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2a2a2a; z-index: 9999;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>
<div id="info">Click: select node | Left-drag: orbit | Right-drag: pan | Scroll: zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
